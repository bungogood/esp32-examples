<!DOCTYPE html>
<html>
    <head>
        <title>ESP32 Catflap Control Test</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>ESP32 Catflap Control</h1>

        <div class="status-box">
            <h3>Current Status</h3>
            <div id="status">Loading...</div>
        </div>

        <div>
            <button class="button" onclick="turnLedOn()">Open Catflap</button>
            <button class="button button-off" onclick="turnLedOff()">
                Close Catflap
            </button>
            <button class="button" onclick="getStatus()">Refresh Status</button>
        </div>

        <script src="app.js"></script>
    </body>
</html>
